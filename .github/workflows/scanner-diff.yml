# D93: the assay-vs-grype comparison that caught D90, running weekly instead
# of by hand; extended by D105 to a second comparison scanner, trivy. It
# scans the same 25 targets with assay and grype (every target), plus trivy
# where a target's entry opts in, reduces each side to (package, CVE)
# tuples, and judges the result against the committed floors in
# .github/scanner-diff-targets.json -- see cmd/scandiff's own top-of-file
# comment for why floors, not an exact-match snapshot, and for why trivy's
# own floors are optional and can start out informational.
#
# The assay database comes from `assay db update` (the published OCI
# artifact), not a local build. Since D114 this is no longer the first check
# on what gets published: db-publish.yml's gate holds every candidate to the
# regression floors before `db push`, so a D90-class corruption that moves
# these targets stops short of the tag. This run remains the check that the
# PUBLIC artifact, pulled anonymously the way a user pulls it, still holds
# those floors -- and the only place the ceilings (maxFindings,
# trivy.maxFindings, maxGrypeOnlyApp, maxAssayOnlyFixed) are judged,
# because the gate skips them: a ceiling measures upstream growth, which a
# human re-bands here, by hand, on Monday.
name: scanner differential

on:
  # Sunday 20:23 UTC (Monday 05:23 KST) is a LOWER BOUND on the start, not
  # the start: GitHub queues scheduled runs, and on minute 0 the weekly began
  # 2 to 3.5 hours late (22:57Z to 00:30Z on `0 21 * * 0`), so the old
  # comment's "Monday 06:00 KST" was hours wrong and the Monday review
  # routine, which reads this run's log at 01:30 UTC, had about 50 minutes
  # of margin on 2026-11-02. Off minute 0 (QA 2026-11-02 #18) the queue is
  # shorter; expect the run between about 20:25Z and 00:00Z, and keep any
  # reader of its log at least three hours after this cron. The nightly
  # (db-publish.yml, 05:17Z) stays well before it.
  schedule:
    - cron: "23 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # No packages permission and no docker login: the published artifact went
  # PUBLIC on 2026-08-28 (a private ghcr package contradicted the README's
  # "anyone runs `assay db update` in seconds" and walled off every outside
  # user), so this job's pull is the same anonymous pull any user makes --
  # which also makes the weekly run a standing check that the package STAYS
  # public: if visibility ever regresses, `assay db update` below fails the
  # run loudly with UNAUTHORIZED, exactly what an outside user would hit.

jobs:
  diff:
    runs-on: ubuntu-latest
    # 25 targets, each an image pull plus two scans (three for the 18 that
    # carry a trivy block, D105). Measured locally at a few minutes per
    # target on a cold cache; a hosted runner, Docker Hub anonymous rate
    # limits (mitigated by mirror.gcr.io, but not eliminated), and now a
    # third scanner per target all push this well past that, so the cap here
    # is generous rather than tight the way db-publish.yml's is.
    timeout-minutes: 120
    env:
      # A workspace-local database, never the developer cache path: this job
      # must always validate a freshly pulled artifact, not whatever a
      # previous run or a runner image happened to leave behind.
      ASSAY_DB_DIR: ${{ github.workspace }}/.assay-db
      # Same reasoning as db-publish.yml's own use of this flag: a scheduled
      # job asking grype's CLI to check for its own updates is one more
      # network call for no benefit to a run that reports its own pinned
      # version below.
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      # trivy prints a one-time notice about its VEX handling on every
      # invocation unless this is set; with 18 targets running trivy, that
      # notice would otherwise repeat 18 times in the log for no benefit --
      # this workflow does not consume VEX at all (see D104's OpenVEX
      # support, which lives on the assay side, not trivy's).
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build assay
        run: go build -o ./bin/assay ./cmd/assay

      - name: Build scandiff
        run: go build -o ./bin/scandiff ./cmd/scandiff

      - name: Build truthset
        run: go build -o ./bin/truthset ./cmd/truthset

      # Pinned grype and trivy plus their vulnerability databases, shared with
      # db-publish.yml's gate (D114) so both judge with the same versions;
      # the pinning and caching reasoning lives with the steps, in the action.
      - uses: ./.github/actions/setup-scanners

      - name: Pull the published assay database
        # Anonymous, deliberately -- see the permissions comment at the top.
        run: ./bin/assay db update

      - name: Run the differential
        id: diff
        run: |
          set +e
          # The shell opens the report redirect before scandiff's own
          # MkdirAll ever runs, so the directory must exist first.
          mkdir -p ./scanner-diff-capture
          ./bin/scandiff \
            -targets .github/scanner-diff-targets.json \
            -assay ./bin/assay \
            -grype ./bin/grype \
            -trivy ./bin/trivy \
            -capture ./scanner-diff-capture \
            > ./scanner-diff-capture/report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # D161: the ground-truth half the differential is not. Every label in
      # testdata/groundtruth/labels.json is scanned through the SBOM path
      # against the same pulled artifact and judged against the distro's own
      # statement; the table carries Wilson intervals. Exit 1 here means a
      # label stopped holding -- the matcher regressed, or the upstream
      # revised its verdict and the label needs re-adjudicating -- and a
      # human decides which; exit 2 means a scan could not run. The kept
      # SBOMs and scan outputs land inside the differential's capture so
      # one artifact carries both, and `truthset -offline` re-judges them.
      - name: Measure against the ground-truth labels
        id: truth
        run: |
          set +e
          mkdir -p ./scanner-diff-capture/truthset
          ./bin/truthset \
            -labels testdata/groundtruth/labels.json \
            -assay ./bin/assay \
            -keep ./scanner-diff-capture/truthset \
            -out ./scanner-diff-capture/truthset/report.json \
            > ./scanner-diff-capture/truthset/report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Captures go up whether the run held its floors or not -- a passing
      # week's numbers are exactly what next week's regression gets compared
      # against by eye, and a failing week is what a human re-judges locally
      # with `scandiff -targets ... -offline ./scanner-diff-capture`. This is
      # also where an INFORMATIONAL trivy target's measured numbers land
      # (report.txt's stdout, D105) for a human to paste into
      # scanner-diff-targets.json.
      - name: Upload captures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-diff-capture
          path: ./scanner-diff-capture
          retention-days: 30

      - name: Publish the report to the job log and summary
        if: always()
        # The weekly review routine reads this run through the GitHub API,
        # whose cloud sandbox cannot reach the Azure Blob host the uploaded
        # artifact lives on (measured 2026-09-07: CONNECT 403). The job LOG
        # is reachable, so the full report table is echoed here between
        # sentinels for the routine to extract, and mirrored to the run's
        # summary page for a human. The artifact upload above stays -- it is
        # the reproducible offline capture; this is only a second,
        # API-readable copy of the one table.
        run: |
          if [ -f ./scanner-diff-capture/report.txt ]; then
            echo "===SCANDIFF-REPORT-BEGIN==="
            cat ./scanner-diff-capture/report.txt
            echo "===SCANDIFF-REPORT-END==="
            {
              echo '## scanner differential'
              echo '```'
              cat ./scanner-diff-capture/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "===SCANDIFF-REPORT-BEGIN==="
            echo "(report.txt was not produced -- the differential step did not reach it)"
            echo "===SCANDIFF-REPORT-END==="
          fi
          # The D161 table, between its own sentinels for the same reader.
          echo "===TRUTHSET-REPORT-BEGIN==="
          if [ -f ./scanner-diff-capture/truthset/report.txt ]; then
            cat ./scanner-diff-capture/truthset/report.txt
            {
              echo '## ground truth (truthset)'
              echo '```'
              cat ./scanner-diff-capture/truthset/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(truthset/report.txt was not produced -- the ground-truth step did not reach it)"
          fi
          echo "===TRUTHSET-REPORT-END==="

      - name: govulncheck, surfaced for the weekly review
        if: always()
        # Runs on the GitHub runner, which CAN reach vuln.go.dev -- the
        # review routine's cloud sandbox cannot (measured 2026-09-07: 403),
        # so the routine reads the marker line below instead of running the
        # tool itself. Informational: a finding is surfaced for a human to
        # act on, it does not fail this differential job, whose own verdict
        # is about matcher regressions, a separate concern. The project still
        # treats govulncheck as the release-time gate (run by hand at tag);
        # this only makes the weekly result visible without a human present.
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "GOVULNCHECK-RESULT: clean"
          else
            echo "GOVULNCHECK-RESULT: not-clean (govulncheck exit $rc)"
          fi

      - name: Fail the job on a breach or an untrustworthy target
        # `|| 2` fails closed, as db-publish.yml's gate does: an empty output
        # (a renamed `id: diff`, a mistyped output name, an `if:` on the diff
        # step) would make this a bare `exit`, which returns 0 -- every weekly
        # run green, and the alert job below closing the pinned failure issue
        # on a differential that never judged. A passing run writes the
        # string "0", which is truthy, so it still exits 0. Audit 2026-10-22
        # P4, re-verified 2026-11-02; internal/ciguard holds every workflow to
        # this shape.
        run: exit ${{ steps.diff.outputs.exit_code || 2 }}

      - name: Fail the job on a ground-truth label that did not hold
        # Same fail-closed shape as the step above (internal/ciguard holds it
        # too). Reached only when the differential held, so a red weekly run
        # has one cause to read, in order: floors first, labels second.
        run: exit ${{ steps.truth.outputs.exit_code || 2 }}

  # D138: one pinned issue per failing ops workflow, closed by the next
  # success. always(), so it runs when the job it watches failed; a
  # cancelled or skipped run is ignored by the script.
  alert:
    needs: [diff]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the pinned failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.diff.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh scripts/ops-alert.sh scanner-diff "$RESULT" "$RUN_URL"
