# One backfill slice of NVD ratings (D65, D66).
#
# Dispatched by hand, once per slice, walking backwards:
#
#   gh workflow run db-backfill.yml -f since_days=240 -f until_days=120
#   gh workflow run db-backfill.yml -f since_days=360 -f until_days=240
#   ...
#
# Run the slices IN ORDER. Coverage only extends backwards when a slice
# touches the range already covered (D65's touch rule) — out of order, the
# ratings land but the claimed coverage stays put, and `db status` will show
# it not advancing.
#
# Each slice seeds from the published artifact and publishes in turn, so the
# artifact is the checkpoint: a failed slice costs one slice, and re-running
# the same slice is safe. --ratings-only (D66) carries the seed's advisories
# verbatim and re-runs only the NVD annotator, which is what fits a slice
# inside the job cap — a full rebuild per slice would add ~75 minutes each.
name: backfill ratings

on:
  workflow_dispatch:
    inputs:
      since_days:
        description: "window start, days before now (max 120 days wide)"
        required: true
      until_days:
        description: "window end, days before now (0 = now)"
        required: true

# One writer to the artifact at a time, across BOTH workflows (same group
# name in each): on 2026-08-14 two backfill walkers raced the same slice and
# the second push was refused by the coverage guard -- correctly, but the race
# itself belongs to the scheduler, not the guard. Queued, never cancelled: a
# backfill slice and the nightly must both eventually run.
concurrency:
  group: db-artifact-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make build
      # D137: see db-publish.yml -- cosign and the signing secret are checked
      # before anything is pushed.
      - uses: ./.github/actions/setup-cosign
      - name: Pre-flight the signing key against the committed public keys (D137)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY >/tmp/signing.pub
          want=$(openssl pkey -pubin -in /tmp/signing.pub -outform DER | sha256sum | cut -c1-16)
          for k in internal/dbcmd/trust/keys/*.pub; do
            have=$(openssl pkey -pubin -in "$k" -outform DER | sha256sum | cut -c1-16)
            [ "$have" = "$want" ] && { echo "signing key is $(basename "$k")"; exit 0; }
          done
          echo "::error::COSIGN_PRIVATE_KEY's public half ($want) matches no committed key under internal/dbcmd/trust/keys/"; exit 2
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Resolve the artifact reference
        id: ref
        run: echo "ref=$(./bin/assay db ref)" >> "$GITHUB_OUTPUT"
      - name: Build the slice
        env:
          NVD_ENABLE: "1"
          NVD_SINCE_DAYS: ${{ inputs.since_days }}
          NVD_UNTIL_DAYS: ${{ inputs.until_days }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Advisories are carried from the seed by --ratings-only, so the
          # advisory providers' switches are irrelevant here; KISA stays off
          # for the same reason as the nightly job — push strips it anyway.
          KISA_ENABLE: "0"
        run: ./bin/assay db build --seed ${{ steps.ref.outputs.ref }} --ratings-only
      - name: What the slice covered
        run: ./bin/assay db status
      - name: Publish
        id: push
        # See db-publish.yml: the digest db push prints is what gets signed.
        run: |
          set -o pipefail
          out=$(./bin/assay db push ${{ steps.ref.outputs.ref }} | tail -n1)
          echo "$out"
          echo "pushed=$out" >> "$GITHUB_OUTPUT"
      - name: Sign the pushed digest (D137)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        # Retried: since D137's second half, a :v<schema> digest left unsigned
        # is an outage for every db update and the next seeded build, so a
        # transient ghcr 5xx on the .sig PUT must not decide it.
        run: |
          for i in 1 2 3; do
            cosign sign --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --yes "$PUSHED" && exit 0
            echo "::warning::cosign sign attempt $i failed"; sleep $((i * 20))
          done
          echo "::error::$PUSHED is pushed and UNSIGNED: every db update refuses it until db-sign.yml is dispatched with this digest"; exit 1
      - name: Self-check the signature against the committed public keys
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          ok=0
          for k in internal/dbcmd/trust/keys/*.pub; do
            if cosign verify --key "$k" --insecure-ignore-tlog=true "$PUSHED" >"/tmp/verify-$(basename "$k").log" 2>&1; then
              echo "verified under $(basename "$k")"; ok=1; break
            fi
          done
          [ "$ok" = 1 ] || { cat /tmp/verify-*.log; echo "::error::the signature just written verifies under no committed key"; exit 2; }

  # D138: a backfill pushes and signs the live tag, so status.json is
  # refreshed after it too. Only `published` moves; lastRun/lastSuccess are
  # the nightly's (cmd/dbstatus).
  status:
    needs: [backfill]
    if: always() && needs.backfill.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Publish status.json
        env:
          RESULT: ${{ needs.backfill.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh scripts/publish-status.sh db-backfill "$RESULT" "$RUN_URL"

  # D138: one pinned issue per failing ops workflow, closed by the next
  # success. always(), so it runs when the job it watches failed; a
  # cancelled or skipped run is ignored by the script.
  alert:
    needs: [backfill, status]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the pinned failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The watched job's result, unless it succeeded and status.json
          # could not be published: that is a failure too.
          RESULT: ${{ (needs.backfill.result == 'success' && needs.status.result == 'failure') && 'failure' || needs.backfill.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh scripts/ops-alert.sh db-backfill "$RESULT" "$RUN_URL"
