name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Comparers are checked against their ecosystems' own implementations.
      # These are behind a build tag because they need the network (apk, npm) or
      # a Debian toolchain (dpkg), so `go test ./...` never runs them — CI is the
      # only place it happens. A silent false negative in version ordering is
      # the failure this project most needs to catch.
      #
      # The whole tagged package runs, deliberately NOT `-run <one test name>`.
      # That form was here first and it silently excluded every replay added
      # after it: the node-semver fixtures shipped and ran nowhere for a day.
      # A check that is counted as coverage and never executes is worse than one
      # that is absent.
      # dpkg is already on an Ubuntu runner; rpm is not. Installed rather than
      # skipped around, because the RPM replay uses rpm's own embedded Lua to
      # call rpmvercmp(), and its requireCI guard turns a missing binary into a
      # failure here on purpose.
      - name: Install rpm for the RPM comparer oracle
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Upstream version vectors
        env:
          # Raises the contents-API limit from 60/hour per shared runner IP to
          # 5,000. Without it a rate-limited fetch is indistinguishable from a
          # working one that found nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -tags upstreamvectors ./internal/version/ -v

      - name: Build
        run: go build ./...
