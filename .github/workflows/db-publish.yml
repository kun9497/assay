name: publish database

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed reference for a one-time recovery build, a ghcr digest; empty = the published tag"
        type: string
        default: ""

# One writer to the artifact at a time, across BOTH workflows (same group
# name in each): on 2026-08-14 two backfill walkers raced the same slice and
# the second push was refused by the coverage guard -- correctly, but the race
# itself belongs to the scheduler, not the guard. Queued, never cancelled: a
# backfill slice and the nightly must both eventually run.
concurrency:
  group: db-artifact-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Comfortably inside the 6h job cap, because this run never does a full
    # NVD pass. It seeds from the published artifact and normally fetches
    # three days of NVD changes. After missed runs the seed's checkpoint
    # extends that window automatically, split into <=120-day requests.
    # The one full pass is a
    # local bootstrap, run once by a human; see the README's "Bootstrapping
    # the first artifact".
    #
    # Raised from 60 when the artifact started carrying Red Hat (D51). Measured
    # on a developer machine the Red Hat pass alone is about 27 minutes, most
    # of it bbolt writing 1.9 million affected entries, and a hosted runner is
    # slower. 120 leaves room for that to grow without leaving room for a hang.
    #
    # Raised to 150 for the D114 gate: the weekly differential over the same
    # targets measures 9-12 minutes, so 150 keeps the headroom 120 had.
    timeout-minutes: 150
    env:
      # D114. store.DefaultPath honours this, and `db build`, `db push` and
      # `assay scan` all resolve the database through it, so the build, the
      # gate and the push below see one file: the candidate the gate judges
      # is the file `db push` packs, not a copy or a cache that could differ.
      ASSAY_DB_DIR: ${{ github.workspace }}/.assay-db
      # The gate runs grype: a scheduled job asking grype's CLI to check for
      # its own updates is one more network call for no benefit to a run
      # whose grype version is pinned in the setup-scanners action.
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      # trivy prints a one-time notice about its VEX handling on every
      # invocation unless this is set; this workflow consumes no trivy VEX,
      # so the notice would only repeat once per trivy target in the log.
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # D89: the D85 Ubuntu tracker spool is a git clone (~193 MB transfer,
      # 2.2 GB tree) that an ephemeral runner would otherwise re-clone every
      # night. A cached spool turns that into a delta fetch. The key is
      # deliberately rolling (never an exact hit): restore-keys always brings
      # back the newest snapshot and the post-job save uploads the refreshed
      # one, because the tracker updates continuously and an exact-match hit
      # would freeze it.
      - name: Cache the Ubuntu CVE tracker spool
        uses: actions/cache@v4
        with:
          # Go's os.TempDir() on a Linux runner is /tmp (RUNNER_TEMP is a
          # different directory and TMPDIR is unset), so the spool lands here.
          path: /tmp/assay-ubuntu-cve-tracker
          key: ubuntu-cve-tracker-${{ github.run_id }}
          restore-keys: |
            ubuntu-cve-tracker-
      - run: make build
      - name: Build scandiff
        run: go build -o ./bin/scandiff ./cmd/scandiff
      # D114: the same pinned grype and trivy the weekly differential uses.
      # Set up before the build, so a scanner that fails to install fails
      # the job in a minute rather than after a thirty-minute build.
      - uses: ./.github/actions/setup-scanners
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Resolve the artifact reference
        id: ref
        # Read from the binary rather than written literally: the tag is the
        # schema version, and a hardcoded :v6 here would keep publishing to
        # the old tag after a bump, silently serving everyone a database
        # their assay refuses.
        run: echo "ref=$(./bin/assay db ref)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          NVD_ENABLE: "1"
          # Three days of normal overlap. The NVD annotator resumes from the
          # seed checkpoint if an outage lasted longer than this window.
          NVD_SINCE_DAYS: "3"
          # Off here, on by default everywhere else (D37). db push strips
          # enrichment before publishing, so fetching it would mean 41 requests
          # to a public-sector service for data this job deletes seconds later.
          # The flag has to be honoured as "0" for that to work, which it was
          # not until D37 replaced the non-empty test.
          KISA_ENABLE: "0"
          # D51. The artifact carries Red Hat's CSAF VEX data: it is TLP:WHITE
          # on all 67,261 documents, so unlike KISA there is nothing to strip,
          # and it is the only source that can say a package is affected and
          # will not be fixed. Set explicitly rather than left to the default
          # so that changing the default cannot silently narrow what is
          # published -- db push would refuse it, but a refused daily publish
          # is a worse way to find out than a line in this file.
          REDHAT_ENABLE: "1"
        # The seed fetch is the first thing that touches ghcr, so an access
        # problem surfaces here. DENIED is not a code defect and reads like
        # one: GITHUB_TOKEN can only touch packages LINKED to this repository,
        # and the first artifact was bootstrapped by hand with a personal
        # token, so it was linked to nothing. That cost two silent daily
        # failures (2026-08-04, 2026-08-05) before anyone read the log, so the
        # remedy is printed next to the error rather than left to be rederived.
        run: |
          set -o pipefail
          # D110 recovery: dispatching with `seed` set to a ghcr digest (e.g.
          # the 08-30 snapshot that still carries Debian:11) reruns tonight's
          # build from that snapshot instead of an operator's machine -- selects the seed only, never --force.
          if ! ./bin/assay db build --seed ${{ inputs.seed != '' && inputs.seed || steps.ref.outputs.ref }} 2>&1 | tee /tmp/build.log; then
            if grep -q DENIED /tmp/build.log; then
              echo "::error::GITHUB_TOKEN cannot reach ${{ steps.ref.outputs.ref }}."
              echo "::error::Link the package to this repository once: the ghcr.io package page ->"
              echo "::error::Package settings -> Manage Actions access -> add kun9497/assay with Write."
              echo "::error::Artifacts pushed from here carry org.opencontainers.image.source and link"
              echo "::error::themselves; one bootstrapped by hand before that existed does not."
            fi
            exit 2
          fi
      # D114. The candidate the Build step just wrote is scanned through
      # scandiff against the weekly differential's targets and committed
      # floors, so a database whose matches moved while its counts held --
      # the D90 shape, which the #135 coverage guard in `db push` cannot see
      # -- fails here instead of reaching the tag. -regressions-only skips
      # the ceilings: a ceiling measures upstream growth, which a human
      # re-bands on Monday and which must never stop new advisories from
      # shipping. An assay scan that exits 2 is retried once inside
      # scandiff (the 2026-10-06 revision, after a mirror.gcr.io
      # BLOB_UNKNOWN transient refused a sound candidate). A target that
      # fails twice, or any breach, still stops the publish with no further
      # retry: the next nightly seeds from the last GOOD artifact, since
      # nothing past it was pushed, and tries again.
      # A seed-input recovery build is gated the same way -- it reaches
      # this step through the same Build step.
      - name: Gate the candidate on the differential's regression floors (D114)
        id: gate
        run: |
          set +e
          # The shell opens the report redirect before scandiff's own
          # MkdirAll ever runs, so the directory must exist first.
          mkdir -p ./scanner-diff-capture
          # Disk headroom on the nightly runner is unmeasured: this job now
          # holds the seed, the candidate, the tracker spool, two scanner
          # databases and 25 image pulls. Printed so the first gated run
          # records the number instead of a human guessing it.
          df -h . | tail -1
          ./bin/scandiff -regressions-only \
            -targets .github/scanner-diff-targets.json \
            -assay ./bin/assay \
            -grype ./bin/grype \
            -trivy ./bin/trivy \
            -capture ./scanner-diff-capture \
            > ./scanner-diff-capture/report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      # Uploaded whether the gate held or not, the way the weekly run does:
      # a breach is re-judged locally with
      # `scandiff -targets ... -offline <capture> -regressions-only`.
      # if-no-files-found: ignore, because a failed Build never reaches the
      # gate and a missing capture must not add a second error to that run.
      - name: Upload the gate's captures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-gate-capture
          path: ./scanner-diff-capture
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish the gate's report to the job log and summary
        if: always()
        # Same sentinels as scanner-diff.yml, unchanged, so the weekly
        # review routine -- which reads job logs through the GitHub API and
        # cannot reach the artifact's blob host -- can read either run.
        run: |
          if [ -f ./scanner-diff-capture/report.txt ]; then
            echo "===SCANDIFF-REPORT-BEGIN==="
            cat ./scanner-diff-capture/report.txt
            echo "===SCANDIFF-REPORT-END==="
            {
              echo '## promotion gate (scanner differential, regressions only)'
              echo '```'
              cat ./scanner-diff-capture/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "===SCANDIFF-REPORT-BEGIN==="
            echo "(report.txt was not produced -- the gate step did not reach it)"
            echo "===SCANDIFF-REPORT-END==="
          fi
      - name: Refuse to publish on a regression or an untrustworthy target
        # `|| 2` fails closed: an empty output would make this a bare `exit`,
        # which returns 0 and lets Publish run on a gate that never judged.
        # The output is the string "0" on a pass, which is truthy, so a
        # passing gate still exits 0.
        run: exit ${{ steps.gate.outputs.exit_code || 2 }}
      - name: Publish
        run: ./bin/assay db push ${{ steps.ref.outputs.ref }}
