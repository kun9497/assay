name: publish database

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Comfortably inside the 6h job cap, because this run never does a full
    # NVD pass. It seeds from the published artifact and fetches three days
    # of NVD changes on top -- minutes, not hours. The one full pass is a
    # local bootstrap, run once by a human; see the README's "Bootstrapping
    # the first artifact".
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make build
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Resolve the artifact reference
        id: ref
        # Read from the binary rather than written literally: the tag is the
        # schema version, and a hardcoded :v6 here would keep publishing to
        # the old tag after a bump, silently serving everyone a database
        # their assay refuses.
        run: echo "ref=$(./bin/assay db ref)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          NVD_ENABLE: "1"
          # Three days, not one: a run that fails leaves no gap, because the
          # next day's window still covers what it missed. One day would
          # make every skipped run a permanent hole in the ratings.
          NVD_SINCE_DAYS: "3"
        # The seed fetch is the first thing that touches ghcr, so an access
        # problem surfaces here. DENIED is not a code defect and reads like
        # one: GITHUB_TOKEN can only touch packages LINKED to this repository,
        # and the first artifact was bootstrapped by hand with a personal
        # token, so it was linked to nothing. That cost two silent daily
        # failures (2026-08-04, 2026-08-05) before anyone read the log, so the
        # remedy is printed next to the error rather than left to be rederived.
        run: |
          set -o pipefail
          if ! ./bin/assay db build --seed ${{ steps.ref.outputs.ref }} 2>&1 | tee /tmp/build.log; then
            if grep -q DENIED /tmp/build.log; then
              echo "::error::GITHUB_TOKEN cannot reach ${{ steps.ref.outputs.ref }}."
              echo "::error::Link the package to this repository once: the ghcr.io package page ->"
              echo "::error::Package settings -> Manage Actions access -> add kun9497/assay with Write."
              echo "::error::Artifacts pushed from here carry org.opencontainers.image.source and link"
              echo "::error::themselves; one bootstrapped by hand before that existed does not."
            fi
            exit 2
          fi
      - name: Publish
        run: ./bin/assay db push ${{ steps.ref.outputs.ref }}
