# D114: the scanner setup the nightly publish gate (db-publish.yml) and the
# weekly differential (scanner-diff.yml) share. Both judge assay against the
# same committed floors, so they must judge with the same grype and trivy:
# if the two workflows could drift apart, a breach in one and not the other
# would be ambiguous between "assay regressed" and "the comparison tool
# changed underneath one of them". One file, one version input each, so a
# bump is one edit that moves both workflows at once.
#
# Run after actions/checkout -- a local action is read from the workspace.
# A composite action cannot set job-level env, so GRYPE_CHECK_FOR_APP_UPDATE
# and TRIVY_DISABLE_VEX_NOTICE stay in each calling workflow's job env.
name: setup scanners
description: Install the pinned grype and trivy into ./bin and refresh both vulnerability databases

inputs:
  # Pinned, not "latest": a moving grype version would make a floor breach
  # ambiguous between "assay regressed" and "grype changed underneath this
  # workflow". Bump this deliberately, in the same commit as a re-seed of the
  # floors file, when there is a reason to.
  grype-version:
    description: grype release to install
    default: v0.116.1
  # Same pinning reasoning as grype above. Spelled here rather than implied by
  # whatever the runner image happens to carry; bump deliberately, in the
  # same commit as a re-seed of any trivy floor.
  trivy-version:
    description: trivy release to install
    default: v0.74.0

runs:
  using: composite
  steps:
    - name: Install grype ${{ inputs.grype-version }}
      shell: bash
      env:
        GRYPE_VERSION: ${{ inputs.grype-version }}
      run: |
        curl -sSfL https://get.anchore.io/grype | sh -s -- -b ./bin "$GRYPE_VERSION"
        ./bin/grype version

    - name: Update grype's vulnerability database
      shell: bash
      run: ./bin/grype db update

    # The official setup action rather than install.sh: the script's
    # unauthenticated release-asset download failed silently on the weekly
    # run's first dispatch (2026-08-28, exit 1 straight after "found
    # version", no message past curl -s), while the action authenticates
    # with the workflow's own token and caches the binary.
    - name: Install trivy ${{ inputs.trivy-version }}
      uses: aquasecurity/setup-trivy@v0.3.1
      with:
        version: ${{ inputs.trivy-version }}
    - name: Symlink trivy into ./bin
      # scandiff is invoked with -trivy ./bin/trivy, matching how assay and
      # grype already live in ./bin — one place to look when a capture needs
      # reproducing locally.
      shell: bash
      run: |
        mkdir -p ./bin
        ln -sf "$(command -v trivy)" ./bin/trivy
        ./bin/trivy version

    # trivy's own default cache dir (TRIVY_CACHE_DIR unset): keyed on the
    # pinned version so a version bump never reuses a stale-schema cache,
    # and on the ISO week so the DB itself still gets a fresh pull once a
    # week the way grype's `db update` step above always does -- a cache
    # that never expired would silently drift the differential's trivy
    # side away from "this week's" vulnerability data.
    - name: Determine trivy DB cache key
      id: trivy-cache-key
      shell: bash
      run: echo "week=$(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"

    - name: Cache trivy vulnerability DB
      uses: actions/cache@v4
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ inputs.trivy-version }}-${{ steps.trivy-cache-key.outputs.week }}
        restore-keys: |
          trivy-db-${{ inputs.trivy-version }}-

    - name: Update trivy's vulnerability database
      shell: bash
      run: ./bin/trivy image --download-db-only
