# Example: scan a container image with assay in GitLab CI, keep the report as
# a job artifact, and fail the pipeline on a high-or-worse finding.
#
# Copy the `assay_scan` job into your own .gitlab-ci.yml and adjust IMAGE.
#
# GitLab has no built-in SARIF ingestion the way GitHub's Security tab does,
# so this keeps the JSON report as a downloadable artifact (and a SARIF one
# for tools that read it). The build verdict comes from assay's exit code.
assay_scan:
  image: alpine:3.20
  variables:
    IMAGE: alpine:3.19 # <-- the image to scan
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/kun9497/assay/main/install.sh | sh -s -- -b /usr/local/bin
    - assay --version
  script:
    # Pulls the published database from ghcr.io/kun9497/assay-db — a public
    # artifact, no login needed. If your network cannot reach ghcr.io, run
    # `assay db build` instead (slower, needs no external artifact).
    - assay db update
    # Produce both reports; the exit code (captured) decides the verdict.
    - assay scan "$IMAGE" --output json  > assay.json
    - |
      set +e
      assay scan "$IMAGE" --output sarif --fail-on high > assay.sarif
      code=$?
      # exit 1 = finding at/above threshold, 2 = scan untrustworthy; both fail.
      exit $code
  artifacts:
    when: always # keep the report even when the gate fails the job
    paths:
      - assay.json
      - assay.sarif
    expire_in: 30 days
