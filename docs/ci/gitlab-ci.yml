# Copy this job into .gitlab-ci.yml and set IMAGE and PLATFORM to your deployed image.
assay_scan:
  image: alpine:3.20
  variables:
    IMAGE: mirror.gcr.io/library/alpine@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
    PLATFORM: linux/amd64
  before_script:
    - apk add --no-cache curl openssl
    - sh -c 't=$(mktemp) && (curl -sSfL --connect-timeout 5 --proto-redir =https -o "$t" https://raw.githubusercontent.com/kun9497/assay/373eeae23ca4b86d8dcf359eb7c1539ab185ba16/install.sh || curl -sSfL --connect-timeout 5 --proto-redir =https -H "Accept:application/vnd.github.raw+json" -o "$t" "https://api.github.com/repos/kun9497/assay/contents/install.sh?ref=373eeae23ca4b86d8dcf359eb7c1539ab185ba16") && sh "$t" -b /usr/local/bin; s=$?; rm -f "$t"; exit $s'
    - assay version
  script:
    - assay db update
    - assay db status --output json
    - |
      report_dir="assay-reports-$CI_JOB_ID"
      mkdir "$report_dir"
      verdict=0
      for format in json sarif; do
        code=0
        assay scan "$IMAGE" --platform "$PLATFORM" --config none --fail-on high --fail-on-incomplete --output "$format" > "$report_dir/current" || code=$?
        if [ "$code" -gt "$verdict" ]; then verdict=$code; fi
        if [ ! -s "$report_dir/current" ]; then break; fi
        mv "$report_dir/current" "$report_dir/assay.$format"
      done
      exit "$verdict"
  artifacts:
    when: always
    paths:
      - assay-reports-$CI_JOB_ID/assay.json
      - assay-reports-$CI_JOB_ID/assay.sarif
    expire_in: 30 days
