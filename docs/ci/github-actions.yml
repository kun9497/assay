# Copy into .github/workflows/ and set IMAGE and PLATFORM to your deployed image.
name: vulnerability scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read # upload-sarif reads workflow runs in private repositories
  contents: read
  security-events: write # required for SARIF upload to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      IMAGE: mirror.gcr.io/library/alpine@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
      PLATFORM: linux/amd64
    steps:
      - name: Install assay
        run: |
          sh -c 't=$(mktemp) && (curl -sSfL --connect-timeout 5 --proto-redir =https -o "$t" https://raw.githubusercontent.com/kun9497/assay/373eeae23ca4b86d8dcf359eb7c1539ab185ba16/install.sh || curl -sSfL --connect-timeout 5 --proto-redir =https -H "Accept:application/vnd.github.raw+json" -o "$t" "https://api.github.com/repos/kun9497/assay/contents/install.sh?ref=373eeae23ca4b86d8dcf359eb7c1539ab185ba16") && sudo sh "$t" -b /usr/local/bin; s=$?; rm -f "$t"; exit $s'
          assay version

      - name: Update the signed vulnerability database
        run: |
          assay db update
          assay db status --output json

      - name: Scan and apply policy
        id: scan
        run: |
          report=$(mktemp --suffix=.sarif "$RUNNER_TEMP/assay.XXXXXXXX")
          code=0
          assay scan "$IMAGE" --platform "$PLATFORM" --config none --fail-on high --fail-on-incomplete --output sarif > "$report" || code=$?
          if [ -s "$report" ]; then
            echo "sarif=$report" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Upload report to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: assay
