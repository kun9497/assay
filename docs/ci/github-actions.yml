# Example: scan a container image with assay on every push, record the
# findings in GitHub's Security tab (SARIF), and fail the build on a
# high-or-worse finding.
#
# Copy this into .github/workflows/ in your own repo and adjust IMAGE. It is
# an EXAMPLE, not an active workflow in the assay repo itself.
#
# The scan and the gate are ONE step run so the SARIF is always written and
# always uploaded — even when the gate fails — so a failed build still leaves
# the findings recorded in the Security tab, not lost.
name: vulnerability scan

on:
  push:
    branches: [main]
  # A weekly re-scan catches vulnerabilities disclosed after the image was
  # last built, without a code change.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write # upload the SARIF to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      IMAGE: alpine:3.19 # <-- the image to scan
    steps:
      # The commit the latest release was built from, as in the README (the
      # release job keeps it current) -- never a branch, which moves. The
      # installer verifies the release's checksums signature with openssl,
      # which ubuntu-latest ships. Download to a temporary file, then run:
      # the step's shell (bash -e) stops at a failed download, where
      # `curl | sh` had not, and the workspace's own files are not touched.
      - name: Install assay
        run: |
          t=$(mktemp)
          trap 'rm -f "$t"' EXIT
          curl -sSfL -o "$t" https://raw.githubusercontent.com/kun9497/assay/7712a02ba7c103c238d7b7ec95fd63472bcf78d7/install.sh
          sh "$t" -b /usr/local/bin
          assay --version

      # Pulls the published OCI database from ghcr.io/kun9497/assay-db — a
      # public artifact, no login or packages permission needed. If your
      # network cannot reach ghcr.io, run `assay db build` instead — slower,
      # but it needs no external artifact.
      - name: Update the vulnerability database
        run: assay db update

      - name: Scan
        id: scan
        run: |
          set +e
          assay scan "$IMAGE" --output sarif --fail-on high > assay.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Always upload, even when the gate below fails — the point of code
      # scanning is to keep the record regardless of the build verdict.
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: assay.sarif
          category: assay

      # Now let the exit code decide the build: 1 = a finding at or above the
      # threshold, 2 = the scan could not run or its result cannot be trusted.
      - name: Fail on findings
        run: exit ${{ steps.scan.outputs.exit_code }}
