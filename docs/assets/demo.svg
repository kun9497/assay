<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Terminal recording: assay scan alpine:3.19 finds 10 vulnerabilities in Alpine packages, then assay db status lists the covered distros">
  <!-- Real output of `assay scan alpine:3.19`, captured 2026-08-27, replayed
       as a 14s SMIL loop: the command types on, the table prints line by
       line, a second command follows, then the loop holds and restarts.
       Every element's BASE state is the fully-visible frame and the
       animations only override it while they run, so anywhere SMIL does not
       run (old renderers, some previews) the image degrades to the same
       complete static screenshot it was before it animated. -->
  <rect x="0" y="0" width="860" height="470" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="860" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="21" text-anchor="middle" font-size="12" fill="#8b949e">assay</text>

  <defs>
    <!-- Typing is a discrete-step clip reveal rather than per-glyph tspans:
         the step widths only have to LOOK like typing, so they need not
         match any renderer's exact glyph advance. Base width is full so a
         non-animating renderer shows the whole command. -->
    <clipPath id="type1">
      <rect x="18" y="50" width="220" height="20">
        <animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="discrete"
          values="0;28;56;84;112;140;168;196;220;220"
          keyTimes="0;0.030;0.043;0.056;0.069;0.082;0.095;0.108;0.121;1"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="18" y="322" width="160" height="20">
        <animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="discrete"
          values="0;30;60;90;120;160;160"
          keyTimes="0;0.335;0.348;0.361;0.374;0.387;1"/>
      </rect>
    </clipPath>
  </defs>

  <g font-size="13" xml:space="preserve">
    <!-- command 1, typed on -->
    <g clip-path="url(#type1)">
      <text x="18" y="64"><tspan fill="#7ee787">$</tspan> <tspan fill="#c9d1d9">assay scan </tspan><tspan fill="#d2a8ff">alpine:3.19</tspan></text>
    </g>

    <!-- header -->
    <text x="18" y="98"  fill="#8b949e">PACKAGE                VERSION               ECOSYSTEM     ADVISORY               SEVERITY      FIXED IN<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.157;1"/></text>

    <!-- rows: real data, severity-coloured, printed line by line -->
    <text x="18" y="120" fill="#c9d1d9">busybox                1.36.1-r20            Alpine:v3.19  ALPINE-CVE-2024-58251  <tspan fill="#6e7681">low (2.5)</tspan>     1.36.1-r21<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.168;1"/></text>
    <text x="18" y="140" fill="#c9d1d9">busybox                1.36.1-r20            Alpine:v3.19  ALPINE-CVE-2025-46394  <tspan fill="#6e7681">low (3.3)</tspan>     1.36.1-r21<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.179;1"/></text>
    <text x="18" y="160" fill="#c9d1d9">musl                   1.2.4_git20230717-r5  Alpine:v3.19  ALPINE-CVE-2026-40200  <tspan fill="#f85149">high (8.1)</tspan>    1.2.4_git20230717-r6<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.190;1"/></text>
    <text x="18" y="180" fill="#c9d1d9">musl                   1.2.4_git20230717-r5  Alpine:v3.19  ALPINE-CVE-2026-6042   <tspan fill="#d29922">medium (4.8)</tspan>  1.2.4_git20230717-r6<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.201;1"/></text>
    <text x="18" y="200" fill="#c9d1d9">musl-utils <tspan fill="#8b949e">(musl)</tspan>       1.2.4_git20230717-r5  Alpine:v3.19  ALPINE-CVE-2026-40200  <tspan fill="#f85149">high (8.1)</tspan>    1.2.4_git20230717-r6<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.212;1"/></text>
    <text x="18" y="220" fill="#c9d1d9">ssl_client <tspan fill="#8b949e">(busybox)</tspan>    1.36.1-r20            Alpine:v3.19  ALPINE-CVE-2025-46394  <tspan fill="#6e7681">low (3.3)</tspan>     1.36.1-r21<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.223;1"/></text>
    <text x="18" y="240" fill="#6e7681">…and 4 more, each carrying its aliased CVE and the release that fixes it<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.234;1"/></text>

    <!-- summary -->
    <text x="18" y="278" fill="#c9d1d9">15 component(s) seen, 15 evaluated, <tspan fill="#f0f6fc">10 finding(s)</tspan>, 0 not evaluated,<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.254;1"/></text>
    <text x="18" y="298" fill="#c9d1d9">0 unknown severity, 0 with no fix available <tspan fill="#8b949e">(0 will not be fixed)</tspan><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.261;1"/></text>

    <!-- command 2, typed on -->
    <g clip-path="url(#type2)">
      <text x="18" y="336"><tspan fill="#7ee787">$</tspan> <tspan fill="#c9d1d9">assay db </tspan><tspan fill="#d2a8ff">status</tspan></text>
    </g>
    <text x="18" y="358" fill="#8b949e">schema:  <tspan fill="#c9d1d9">v9</tspan>   covers: <tspan fill="#c9d1d9">Alpine, Debian, Ubuntu, RHEL, Rocky, Alma, Amazon,</tspan><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.421;1"/></text>
    <text x="18" y="376" fill="#c9d1d9">         Oracle, Fedora, SUSE, Wolfi, Chainguard, Azure Linux, Photon,<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.432;1"/></text>
    <text x="18" y="394" fill="#c9d1d9">         Arch, Alpaquita, MinimOS, Echo, Hummingbird, Bitnami, CleanStart<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.443;1"/></text>
    <text x="18" y="414" fill="#8b949e">databases: <tspan fill="#c9d1d9">OSV · Red Hat · SUSE · Oracle · Amazon · Fedora · Photon · Arch · NVD · KISA</tspan><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.454;1"/></text>

    <!-- final prompt + blinking cursor: the group reveals at its timeline
         slot, the inner rect keeps its own blink; nesting the two opacity
         animations is what lets them compose instead of fighting over one
         attribute. (No double hyphen in this comment on purpose: it is
         illegal inside an XML comment, and the first version of this file
         shipped one here, which strict renderers rejected as a whole.) -->
    <g>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.479;1"/>
      <text x="18" y="450"><tspan fill="#7ee787">$</tspan></text>
      <rect x="30" y="440" width="8" height="14" fill="#c9d1d9">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
