<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Terminal: assay scan alpine:3.19 finds 10 vulnerabilities in Alpine packages">
  <!-- Real output of `assay scan alpine:3.19`, captured 2026-08-27. A full,
       legible terminal screenshot on its own: the only animation is the
       blinking cursor (SMIL), so the image degrades to a complete static
       frame anywhere the animation does not run. -->
  <rect x="0" y="0" width="860" height="470" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="860" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="21" text-anchor="middle" font-size="12" fill="#8b949e">assay</text>

  <g font-size="13" xml:space="preserve">
    <!-- command -->
    <text x="18" y="64"><tspan fill="#7ee787">$</tspan> <tspan fill="#c9d1d9">assay scan </tspan><tspan fill="#d2a8ff">alpine:3.19</tspan></text>

    <!-- header -->
    <text x="18" y="98"  fill="#8b949e">PACKAGE                VERSION               ECOSYSTEM     ADVISORY               SEVERITY      FIXED IN</text>

    <!-- rows: real data, severity-coloured -->
    <text x="18" y="120" fill="#c9d1d9">busybox                1.36.1-r20            Alpine:v3.19  ALPINE-CVE-2024-58251  <tspan fill="#6e7681">low (2.5)</tspan>     1.36.1-r21</text>
    <text x="18" y="140" fill="#c9d1d9">busybox                1.36.1-r20            Alpine:v3.19  ALPINE-CVE-2025-46394  <tspan fill="#6e7681">low (3.3)</tspan>     1.36.1-r21</text>
    <text x="18" y="160" fill="#c9d1d9">musl                   1.2.4_git20230717-r5  Alpine:v3.19  ALPINE-CVE-2026-40200  <tspan fill="#f85149">high (8.1)</tspan>    1.2.4_git20230717-r6</text>
    <text x="18" y="180" fill="#c9d1d9">musl                   1.2.4_git20230717-r5  Alpine:v3.19  ALPINE-CVE-2026-6042   <tspan fill="#d29922">medium (4.8)</tspan>  1.2.4_git20230717-r6</text>
    <text x="18" y="200" fill="#c9d1d9">musl-utils <tspan fill="#8b949e">(musl)</tspan>       1.2.4_git20230717-r5  Alpine:v3.19  ALPINE-CVE-2026-40200  <tspan fill="#f85149">high (8.1)</tspan>    1.2.4_git20230717-r6</text>
    <text x="18" y="220" fill="#c9d1d9">ssl_client <tspan fill="#8b949e">(busybox)</tspan>    1.36.1-r20            Alpine:v3.19  ALPINE-CVE-2025-46394  <tspan fill="#6e7681">low (3.3)</tspan>     1.36.1-r21</text>
    <text x="18" y="240" fill="#6e7681">…and 4 more, each carrying its aliased CVE and the release that fixes it</text>

    <!-- summary -->
    <text x="18" y="278" fill="#c9d1d9">15 component(s) seen, 15 evaluated, <tspan fill="#f0f6fc">10 finding(s)</tspan>, 0 not evaluated,</text>
    <text x="18" y="298" fill="#c9d1d9">0 unknown severity, 0 with no fix available <tspan fill="#8b949e">(0 will not be fixed)</tspan></text>

    <!-- second command: db status -->
    <text x="18" y="336"><tspan fill="#7ee787">$</tspan> <tspan fill="#c9d1d9">assay db </tspan><tspan fill="#d2a8ff">status</tspan></text>
    <text x="18" y="358" fill="#8b949e">schema:  <tspan fill="#c9d1d9">v9</tspan>   covers: <tspan fill="#c9d1d9">Alpine, Debian, Ubuntu, RHEL, Rocky, Alma, Amazon,</tspan></text>
    <text x="18" y="376" fill="#c9d1d9">         Oracle, Fedora, SUSE, Wolfi, Chainguard, Azure Linux, Photon,</text>
    <text x="18" y="394" fill="#c9d1d9">         Arch, Alpaquita, MinimOS, Echo, Hummingbird, Bitnami, CleanStart</text>
    <text x="18" y="414" fill="#8b949e">databases: <tspan fill="#c9d1d9">OSV · Red Hat · SUSE · Oracle · Amazon · Fedora · Photon · Arch · NVD · KISA</tspan></text>

    <!-- prompt + blinking cursor -->
    <text x="18" y="450"><tspan fill="#7ee787">$</tspan> <tspan fill="#c9d1d9">_</tspan></text>
    <rect x="30" y="440" width="8" height="14" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
